name: deploy portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: install dependencies
        run: pnpm install
        
      - name: build project
        run: pnpm run build
        
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4

  # mirror the homepage (the cv) to the repo that serves cv.utku.space. the page is
  # self-contained, so its one html file plus a CNAME is the whole site. skips quietly until
  # the CV_DEPLOY_TOKEN secret exists: a fine-grained token with contents read & write on
  # mutkuoz/cv only. never blocks a deploy.
  cv:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CV_TOKEN: ${{ secrets.CV_DEPLOY_TOKEN }}
    steps:
      - name: download built site
        if: env.CV_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: push the cv to mutkuoz/cv
        if: env.CV_TOKEN != ''
        run: |
          mkdir site && tar -xf artifact.tar -C site ./index.html
          git clone --depth 1 "https://x-access-token:${CV_TOKEN}@github.com/mutkuoz/cv.git" out
          cp site/index.html out/index.html
          echo "cv.utku.space" > out/CNAME
          touch out/.nojekyll
          cd out
          git config user.name "utku.space deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "cv unchanged"; exit 0; fi
          git commit -m "cv from mutkuoz.github.io@${GITHUB_SHA::7}"
          git push origin HEAD:main

  # mirror the hello page (an easter egg, utku.space/hello/) to the repo that serves
  # hello.utku.space. same mechanism as the cv job: one self-contained html file plus a
  # CNAME. uses HELLO_DEPLOY_TOKEN, or the cv token if that one is also granted mutkuoz/hello.
  # skips quietly until a token exists. never blocks a deploy.
  hello:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HELLO_TOKEN: ${{ secrets.HELLO_DEPLOY_TOKEN || secrets.CV_DEPLOY_TOKEN }}
    steps:
      - name: download built site
        if: env.HELLO_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: push the hello page to mutkuoz/hello
        if: env.HELLO_TOKEN != ''
        run: |
          mkdir site && tar -xf artifact.tar -C site ./hello/index.html
          git clone --depth 1 "https://x-access-token:${HELLO_TOKEN}@github.com/mutkuoz/hello.git" out
          cp site/hello/index.html out/index.html
          echo "hello.utku.space" > out/CNAME
          touch out/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          cd out
          git config user.name "utku.space deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "hello unchanged"; exit 0; fi
          git commit -m "hello from mutkuoz.github.io@${GITHUB_SHA::7}"
          git push origin HEAD:main

  # tell bing, yandex, seznam, and naver that pages changed instead of waiting for
  # the next crawl. bing's index feeds chatgpt search and copilot. never blocks a deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      INDEXNOW_KEY: 368e2a1fa1756870fd5bf2c029204108
    steps:
      - name: download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: submit sitemap urls to indexnow
        run: |
          tar -xf artifact.tar ./sitemap.xml
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -sc .)
          for attempt in $(seq 1 12); do
            curl -fsS "https://utku.space/$INDEXNOW_KEY.txt" -o /dev/null && break
            sleep 10
          done
          jq -n --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "utku.space", key: $key, keyLocation: "https://utku.space/\($key).txt", urlList: $urls}' \
            | curl -sS -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' \
                --data-binary @- -w 'indexnow responded %{http_code}\n'